{{- if and .Values.callbackSecret.create (not .Values.callbackSecret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tidal.callbackSecretName" . }}
  labels: {{- include "tidal.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{/* Generate once and keep across upgrades. Helm regenerates on each render
       unless we use lookup; without state lookup we rely on kubectl preserving
       the existing secret because of resource-policy=keep + we only emit on first install. */}}
  callback-secret: {{ randAlphaNum 48 | b64enc | quote }}
{{- end }}
{{- if not .Values.externalDatabase.existingSecret }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tidal.databaseSecretName" . }}
  labels: {{- include "tidal.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
{{- else if .Values.externalDatabase.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tidal.databaseSecretName" . }}
  labels: {{- include "tidal.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.externalDatabase.url | quote }}
{{- end }}
{{- end }}
{{- if not .Values.externalRedis.existingSecret }}
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tidal.redisSecretName" . }}
  labels: {{- include "tidal.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-url: "redis://{{ .Release.Name }}-redis-master.{{ .Release.Namespace }}.svc.cluster.local:6379/0"
{{- else if .Values.externalRedis.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tidal.redisSecretName" . }}
  labels: {{- include "tidal.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-url: {{ .Values.externalRedis.url | quote }}
{{- end }}
{{- end }}
