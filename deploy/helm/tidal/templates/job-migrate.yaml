{{- if .Values.migrations.runOnInstall }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tidal.fullname" . }}-migrate
  labels: {{- include "tidal.labels" . | nindent 4 }}
  annotations:
    # Sync hook: runs during ArgoCD sync, NOT tracked as a regular resource.
    # Wave 5 fires before the Deployment waves (10) so schema lands before
    # servers boot. The Sync phase (vs PreSync) lets the Job reference the
    # chart-managed Secrets and Postgres subchart that come up in the same
    # sync round.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "tidal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tidal"]
          args: ["migrate", "up"]
          env:
            - name: TIDAL_LOG_PRETTY
              value: "false"
            - name: TIDAL_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tidal.databaseSecretName" . }}
                  key: database-url
            - name: TIDAL_REDIS_URL
              value: "redis://localhost:6379/0"  # not used by migrate; satisfy validation
{{- end }}
