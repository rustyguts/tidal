{{- if .Values.migrations.runOnInstall }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tidal.fullname" . }}-migrate
  labels: {{- include "tidal.labels" . | nindent 4 }}
  annotations:
    # Run BEFORE the deployments so the schema is in place when servers boot.
    # We use ArgoCD sync-wave (regular resource, wave 5) instead of a helm
    # pre-install hook so the migrate Job sees the chart-managed Secrets,
    # ServiceAccounts, and the Postgres subchart.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "tidal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tidal"]
          args: ["migrate", "up"]
          env:
            - name: TIDAL_LOG_PRETTY
              value: "false"
            - name: TIDAL_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tidal.databaseSecretName" . }}
                  key: database-url
            - name: TIDAL_REDIS_URL
              value: "redis://localhost:6379/0"  # not used by migrate; satisfy validation
            - name: TIDAL_CALLBACK_SECRET
              value: "unused-by-migrate"
{{- end }}
