services:
  server:
    build: .
    command: server
    ports:
      - "${TIDAL_HOST_PORT:-8090}:8080"
    environment:
      TIDAL_ENV: development
      TIDAL_LOG_LEVEL: debug
      TIDAL_LOG_PRETTY: "true"
      TIDAL_HTTP_ADDR: ":8080"
      TIDAL_DB_URL: postgres://tidal:tidal@postgres:5432/tidal?sslmode=disable
      TIDAL_REDIS_URL: redis://redis:6379/0
      TIDAL_DISPATCHER: local
      TIDAL_MEDIA_ROOTS: /media
      TIDAL_AUTO_MIGRATE: "true"
    volumes:
      - media:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: worker
    environment:
      TIDAL_ENV: development
      TIDAL_LOG_LEVEL: debug
      TIDAL_LOG_PRETTY: "true"
      TIDAL_DB_URL: postgres://tidal:tidal@postgres:5432/tidal?sslmode=disable
      TIDAL_REDIS_URL: redis://redis:6379/0
      TIDAL_DISPATCHER: local
      TIDAL_MEDIA_ROOTS: /media
    volumes:
      - media:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    image: oven/bun:1
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/app
      - ui-node-modules:/app/node_modules
    environment:
      VITE_API_PROXY: http://server:8080
    command: ["sh", "-c", "bun install && bun run dev --host 0.0.0.0"]
    depends_on:
      server:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tidal
      POSTGRES_PASSWORD: tidal
      POSTGRES_DB: tidal
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis:
  media:
  postgres:
  ui-node-modules:
